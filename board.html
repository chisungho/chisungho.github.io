<style>
*{box-sizing:border-box;margin:0;padding:0}
a{color:inherit;text-decoration:none}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:radial-gradient(900px 500px at 90% 0%,rgba(34,211,238,.08),transparent 65%),#07111f;color:#e7f0ff;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:10;background:rgba(7,17,31,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(148,190,224,.16)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#6366f1);color:#fff;font-size:15px}
nav .home{font-size:14px;font-weight:700;color:#c6d7ec}
nav .home:hover{color:#67e8f9}
.req{background:linear-gradient(90deg,#0e7490,#4338ca);font-size:14.5px;font-weight:700}
.req .wrap{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px;padding-top:6px;padding-bottom:6px;flex-wrap:wrap;text-align:center}
.ml{display:inline-flex;align-items:center;gap:6px;background:#fde047;color:#0f172a;border-radius:99px;padding:5px 14px;font-weight:900;animation:reqBlink 1s steps(1,end) infinite}
.ml:hover,.ml:focus-visible{animation:none;background:#fff}
@keyframes reqBlink{50%{opacity:.15}}
header{padding:48px 0 24px;text-align:center}
header small{color:#22d3ee;font-weight:800;letter-spacing:.12em;font-size:13px}
header h1{font-size:clamp(26px,4vw,34px);font-weight:900;letter-spacing:-.02em;color:#dff7ff;margin-top:4px}
header p{color:#9aacc3;margin-top:6px;font-size:15px}
.howto{background:rgba(15,31,52,.72);border:1px solid rgba(148,190,224,.16);border-radius:16px;padding:16px 18px;font-size:14.5px;color:#c6d7ec;margin-bottom:22px}
.howto b{color:#fde047}
.list{display:grid;gap:10px;padding-bottom:70px}
.post{background:rgba(15,31,52,.72);border:1px solid rgba(148,190,224,.16);border-radius:16px;overflow:hidden;scroll-margin-top:80px}
.post.open,.post:target{border-color:#67e8f9}
.post summary{list-style:none;display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer}
.post summary::-webkit-details-marker{display:none}
.tag{flex:none;font-size:12px;font-weight:800;color:#0f172a;background:#67e8f9;border-radius:99px;padding:3px 10px}
.tag.pg{background:#a3e635}
.tt{flex:1;min-width:0;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{flex:none;font-size:12.5px;color:#9aacc3}
.bd{padding:0 18px 18px;font-size:15px;color:#d5e3f3;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.go{display:inline-block;margin-top:14px;background:#22d3ee;color:#04202b;font-weight:800;border-radius:99px;padding:9px 18px;font-size:14px;white-space:normal}
.em{text-align:center;color:#9aacc3;padding:30px}
footer{border-top:1px solid rgba(148,190,224,.12);padding:26px 0;text-align:center;font-size:13px;color:#9aacc3}
@media(max-width:560px){.req{font-size:13.5px}.req .wrap{gap:8px}.post summary{padding:13px 14px;gap:9px}.tt{white-space:normal}.dt{display:none}.bd{padding:0 14px 16px}}
</style>
</head>
<body>
<div class="req" role="region" aria-label="도구 신청 안내"><div class="wrap">
  <span>필요한 도구 신청을 해주세요</span>
  <a class="ml" href="mailto:hgy671001@gmail.com?subject=%5Bcsh2020%5D%20%ED%95%84%EC%9A%94%ED%95%9C%20%EB%8F%84%EA%B5%AC%20%EC%8B%A0%EC%B2%AD&amp;body=%E2%96%A0%20%ED%95%84%EC%9A%94%ED%95%9C%20%EB%8F%84%EA%B5%AC%20%EC%9D%B4%EB%A6%84%3A%0A%E2%96%A0%20%EC%96%B4%EB%96%A4%20%EA%B8%B0%EB%8A%A5%EC%9D%B4%20%ED%95%84%EC%9A%94%ED%95%9C%EA%B0%80%EC%9A%94%3F%3A%0A%E2%96%A0%20%EC%B0%B8%EA%B3%A0%ED%95%A0%20%EC%82%AC%EC%9D%B4%ED%8A%B8(%EC%84%A0%ED%83%9D)%3A%0A">✉ 메일로 보내주세요</a>
</div></div>
<nav><div class="wrap">
  <a class="logo" href="/"><i>新</i>새로운 도전을 위하여</a>
  <a class="home" href="/">← 홈으로</a>
</div></nav>

<main class="wrap">
  <header><small>BOARD</small><h1>게시판</h1><p>신청받아 만든 도구와 필요한 프로그램을 올려 둡니다</p></header>
  <div class="howto">필요한 도구나 프로그램은 <b>메일(hgy671001@gmail.com)</b>로 신청해 주세요. 검토해서 만든 도구와 추천 프로그램을 이 게시판에 올려 드립니다.</div>
  <div class="list" id="list"><p class="em">게시글을 불러오는 중...</p></div>
</main>

<footer><div class="wrap"><b>새로운 도전을 위하여</b> · csh2020.com</div></footer>

<script>
(function(){
  var L=document.getElementById('list');
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function safe(u){u=String(u||'').trim();return /^(https?:\/\/|\/)/.test(u)?u:'';}
  fetch('/board.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    var it=(j&&j.items||[]).filter(function(n){return n.published&&n.title;});
    if(!it.length){L.innerHTML='<p class="em">아직 게시글이 없습니다.</p>';return;}
    var hash=decodeURIComponent(location.hash.slice(1));
    L.innerHTML=it.map(function(n,i){
      var u=safe(n.link),open=(hash?hash===n.id:i===0);
      return '<details class="post" id="'+esc(n.id)+'"'+(open?' open':'')+'><summary><span class="tag'+(u?' pg':'')+'">'+(u?'프로그램':'글')+'</span><span class="tt">'+esc(n.title)+'</span><span class="dt">'+esc(n.date)+'</span></summary>'+
        '<div class="bd">'+esc(n.body)+(u?'\n<a class="go" href="'+esc(u)+'"'+(/^https?:/.test(u)?' target="_blank" rel="noopener"':'')+'>프로그램 열기 →</a>':'')+'</div></details>';
    }).join('');
    if(hash){var el=document.getElementById(hash);if(el)el.scrollIntoView();}
  }).catch(function(){L.innerHTML='<p class="em">게시글을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</p>';});
})();
</script>
</body>
</html>
