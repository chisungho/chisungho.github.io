<style>
body{margin:0}
/* Layout: 앱처럼 가운데 한 장 — 상단 앱바, 모드 스위치, 원형 번호판, 큰 생성 버튼, 결과 카드 5장 */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#141a26; --muted:#6b7487; --line:#e2e6ee;
  --accent:#ff5a36; --accent-ink:#ffffff; --accent-soft:#ffe9e3; --warn:#e5162f; --focus:#2f6bff;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 12px 32px -12px rgba(20,26,38,.18);
  --y:#f7c21b; --b:#2f7cf6; --r:#f0454b; --g:#9aa1ad; --gr:#22b36b;
  --ui:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --num:"Outfit","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#171b24; --surface-2:#1e2330; --ink:#eef1f7; --muted:#9099ab; --line:#2a3040;
  --accent:#ff6a47; --accent-soft:#3a2119; --warn:#ff4d5e; --focus:#7aa2ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#171b24; --surface-2:#1e2330; --ink:#eef1f7; --muted:#9099ab; --line:#2a3040;
  --accent:#ff6a47; --accent-soft:#3a2119; --warn:#ff4d5e; --focus:#7aa2ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--accent)}
.logo i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ffd9cf 60%,#ffc2b3);display:block}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:grid;gap:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;border-radius:11px;background:transparent;color:var(--muted);font:600 14px var(--ui);padding:10px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,38,.12)}
.pad{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;padding:6px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,var(--surface))}
@media (max-width:420px){.prow{gap:3px;padding:4px;border-radius:12px}.cell{font-size:12px!important}}
.cell{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 55%,var(--ink));font:600 14px var(--num);cursor:pointer;padding:0;transition:transform .12s,background .15s,border-color .15s}
.cell:hover:not(:disabled){border-color:var(--c);background:color-mix(in srgb,var(--c) 38%,var(--surface))}
.cell:active:not(:disabled){transform:scale(.92)}
.cell:disabled{opacity:.4;cursor:default}
.cell.on{border-color:transparent;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:inset 0 -3px 5px rgba(0,0,0,.18),0 4px 10px -4px var(--c)}
.pad.locked .cell{opacity:.62}
.hint{margin:0;font-size:13px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.go{border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:700 17px var(--ui);padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 24px -12px var(--accent);transition:transform .12s,filter .15s}
.go:hover:not(:disabled){filter:brightness(1.05)}
.go:active:not(:disabled){transform:translateY(1px) scale(.99)}
.go:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.go svg{width:18px;height:18px}
:is(.cell,.go,.seg button,.ghost):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.foot{display:grid;gap:4px;justify-items:center;text-align:center}
.limit{font-weight:700;color:var(--warn);font-size:14.5px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.count{font:500 12.5px var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}
.meter{width:100%;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.folder{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;word-break:break-all}
.folder span{font-family:Consolas,monospace;font-size:11.5px}
.folder .ghost{padding:3px 9px;font-size:11.5px}
.blocked{padding:12px;border-radius:14px;background:var(--accent-soft);color:var(--warn);font-weight:700;text-align:center;font-size:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.head h2{margin:0;font-size:15px;font-weight:700}
.head small{color:var(--muted);font-weight:500;margin-left:6px}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:600 12.5px var(--ui);padding:7px 12px;cursor:pointer}
.games{display:grid;gap:10px}
.game{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface-2)}
.game .lbl{width:28px;height:28px;border-radius:9px;background:var(--surface);display:grid;place-items:center;font:700 13px var(--num);color:var(--muted)}
.balls{display:flex;gap:6px;justify-content:space-between;flex-wrap:nowrap}
.ball{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1 1 0;min-width:0}
.ball span{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 clamp(13px,3.8vw,17px) var(--num);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55) 0 8%,rgba(255,255,255,0) 32%),var(--c);box-shadow:inset 0 -4px 6px rgba(0,0,0,.18),0 4px 10px -4px var(--c)}
.ball.manual span{box-shadow:inset 0 -4px 6px rgba(0,0,0,.18),0 0 0 2.5px var(--surface-2),0 0 0 4.5px var(--ink)}
.ball i{font-style:normal;font-size:10.5px;color:var(--muted);white-space:nowrap}
.c1{--c:var(--y)}.c2{--c:var(--b)}.c3{--c:var(--r)}.c4{--c:var(--g)}.c5{--c:var(--gr)}
.cell.on.c1,.cell.on.c2,.cell.on.c3,.cell.on.c4,.cell.on.c5{background:var(--c)}
.meta{grid-column:2;font:500 11.5px var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:28px 12px;border-radius:16px;border:1.5px dashed var(--line);text-align:center;color:var(--muted);font-size:13.5px;display:grid;gap:10px;justify-items:center}
.empty .ghostballs{display:flex;gap:6px}
.empty .ghostballs i{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line)}
.pop{animation:pop .42s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.go,.cell{transition:none}}
.status{font-size:12px;color:var(--muted);text-align:center}
.logbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;font:600 14px var(--ui);padding:12px;cursor:pointer}
.logbtn:hover{border-color:var(--accent);color:var(--accent)}
.logbtn svg{width:17px;height:17px}
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.dchip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:7px 11px;font:600 12.5px var(--ui);cursor:pointer;display:grid;gap:1px;text-align:center;font-variant-numeric:tabular-nums}
.dchip small{font-weight:500;color:var(--muted);font-size:11px}
.dchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dchip[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.logsum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.logsum b{color:var(--ink)}
.runhead{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:4px}
.runhead b{color:var(--ink);font-size:13px}
.runhead .pill{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 8px;font-weight:600;font-size:11.5px}
.lrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--surface-2)}
.lrow .lbl{font:700 12px var(--num);color:var(--muted);text-align:center}
.lrow .balls .ball span{max-width:34px;font-size:clamp(12px,3.4vw,14px)}
.lrow .balls .ball i{display:none}
.logempty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px;border:1.5px dashed var(--line);border-radius:14px}
:is(.logbtn,.dchip):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.deep{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--accent-soft)}
.deepring{position:relative;width:52px;height:52px;flex:none;display:grid;place-items:center}
.deepring svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 1s linear infinite}
.deepring circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:80 46}
.deepring b{font:700 20px var(--num);color:var(--accent);font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}
.deeptxt{display:grid;gap:4px;min-width:0;flex:1}
.deeptxt strong{font-size:16px;color:var(--accent)}
.deeptxt span{font-size:12.5px;color:var(--ink)}
.deepbar{height:6px;border-radius:99px;background:var(--surface);overflow:hidden}
.deepbar i{display:block;height:100%;width:0;background:var(--accent)}
@media (prefers-reduced-motion:reduce){.deepring svg{animation-duration:3s}}
.status #drawsNote{font-family:Consolas,monospace;font-size:11px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
</style>
</head>
<body>

<main class="app">
  <div class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i></i></div>
      <div><h1>로또 번호 생성기</h1><p>로또 6/45 통계 조합</p></div>
    </div>
    <span class="tag" id="verBadge">테스트 버전</span>
  </div>

  <section class="card" aria-label="번호 생성">
    <div class="seg" role="group" aria-label="선택 방식">
      <button id="mAuto" aria-pressed="true">전부 자동</button>
      <button id="mManual" aria-pressed="false">일부 수동 선택</button>
    </div>
    <div class="pad locked" id="board" aria-label="번호판"></div>
    <p class="hint" id="hint"></p>
    <button class="go" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>번호 생성 · 5게임</button>
    <div class="deep" id="deep" hidden role="status" aria-live="polite">
      <div class="deepring"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/></svg><b id="deepSec">5</b></div>
      <div class="deeptxt"><strong>심층 분석중…</strong><span id="deepStep"></span><div class="deepbar"><i id="deepBar"></i></div></div>
    </div>
    <div class="foot">
      <div class="limit" id="limitMsg">1일 1인(PC 1대) 최대 20게임만 생성됩니다</div>
      <div class="meter" aria-hidden="true"><i id="meter" style="width:0"></i></div>
      <div class="count" id="count">오늘 0 / 4회 · 0 / 20게임</div>
      <div class="count" id="histNote">지금까지 생성한 조합 0개는 다시 나오지 않습니다.</div>
      <div class="count folder" id="folderRow" hidden>기록 폴더 <span id="folderPath"></span> <button class="ghost" id="openFolder">폴더 열기</button></div>
      <div class="count" id="testNote">테스트 버전이라 20게임 제한이 적용되지 않습니다.</div>
    </div>
    <div class="blocked" id="blocked" hidden>오늘 생성 한도(20게임)를 모두 사용했습니다. 내일 다시 이용해 주세요.</div>
  </section>

  <section class="card" aria-label="생성 결과">
    <div class="head"><h2 id="resTitle">생성 번호</h2><button class="ghost" id="copy" hidden>번호 복사</button></div>
    <div class="games" id="games"></div>
  </section>

  <button class="logbtn" id="logOpen" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>생성 기록 조회 (날짜별)</button>

  <section class="card" id="logCard" aria-label="생성 기록 조회" hidden>
    <div class="head"><h2>생성 기록 조회</h2><div style="display:flex;gap:6px"><button class="ghost" id="logCopy">이 날짜 복사</button><button class="ghost" id="logClose">닫기</button></div></div>
    <div class="dates" id="logDates" role="group" aria-label="날짜 선택"></div>
    <div class="logsum" id="logSum"></div>
    <div class="games" id="logList"></div>
  </section>

  <div class="status"><span id="status">과거 당첨번호 전체를 조회하는 중…</span> <button class="ghost" id="retry" hidden>다시 조회</button><br><span id="drawsNote"></span></div>
</main>

<script>
/* ===== 설정 ===== */
const TEST_MODE = false;   // true = 테스트 버전(1일 20게임 제한 미적용), false = 배포 버전
const GAMES_PER_RUN = 5, MAX_RUNS = 4, MAX_GAMES = 20;
const MIRRORS = ["https://raw.githubusercontent.com/smok95/lotto/main/results/","https://cdn.jsdelivr.net/gh/smok95/lotto@main/results/"];

let draws = [];
function merge(rows){
  const m = new Map(draws.map(d=>[d.no,d]));
  for(const r of rows||[]){
    if(!r || !Array.isArray(r) || r.length<9) continue;
    const nums=r.slice(2,8).map(Number).sort((a,b)=>a-b);
    if(nums.some(n=>!(n>=1&&n<=45)) || new Set(nums).size!==6) continue;
    m.set(Number(r[0]),{no:Number(r[0]),date:String(r[1]),nums,bonus:Number(r[8])});
  }
  draws=[...m.values()].sort((a,b)=>a.no-b.no);
}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function rowOf(j){return [j.draw_no,String(j.date).slice(0,10),...j.numbers,j.bonus_no]}
async function getJSON(url,ms=8000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal,cache:"no-store"}); if(!r.ok) throw new Error(r.status); return await r.json()}
  finally{clearTimeout(t)}
}
/* 기준 시각에 이미 추첨이 끝나 결과가 공개됐어야 하는 마지막 회차
   (제1회 2002-12-07 토요일 20:35 추첨, 결과 공개 여유 12시간) */
function expectedLatest(){
  const first=Date.UTC(2002,11,7,11,35);           // 20:35 KST
  const n=Math.floor((Date.now()-first-12*3600e3)/(7*864e5))+1;
  return Math.max(1,n);
}
const missingRounds=()=>{const have=new Set(draws.map(d=>d.no)), out=[]; for(let n=1;n<=Math.max(expectedLatest(),draws.at(-1)?.no||0);n++) if(!have.has(n)) out.push(n); return out};
let DRAWS_OK=false, DRAWS_SRC="";
async function fetchMissing(miss){
  const added=[];
  for(const MIRROR of MIRRORS){
    const left=miss.filter(n=>!added.some(r=>r[0]===n)); if(!left.length) break;
    try{
      if(left.length>30){ const all=await getJSON(MIRROR+"all.json",20000); all.forEach(j=>{ if(left.includes(j.draw_no)) added.push(rowOf(j)) }) }
      else for(const n of left){ try{added.push(rowOf(await getJSON(MIRROR+n+".json")))}catch(e){} }
    }catch(e){}
  }
  return added;
}
/* 실행 전 과거 당첨번호 전체 조회·검증 → 기록 저장 → 분석에 사용 */
async function updateOnce(){
  const st=document.getElementById("status");
  st.textContent="과거 당첨번호 전체를 조회하는 중…";
  merge(EMBED);
  if(Array.isArray(window.LOTTO_UPDATE)) merge(window.LOTTO_UPDATE);   // 실행기가 공식 사이트에서 받아 둔 자료
  if(LOCAL){
    // PC: 문서\로또번호생성기\당첨번호\전체_당첨번호.csv 가 분석 기준 자료
    try{ const j=await api("api/draws"); merge(j.rows); DRAWS_SRC=j.file||"" }catch(e){}
  } else {
    merge(load(KEY+"draws_all")||[]); merge(load("lotto_cache")||[]);
  }
  // 마지막 회차 확인 (공개 자료 저장소)
  for(const MIRROR of MIRRORS){ try{
    const latest=await getJSON(MIRROR+"latest.json");
    if(!draws.some(d=>d.no===latest.draw_no)) merge([rowOf(latest)]);
    break;
  }catch(e){} }
  let miss=missingRounds();
  if(miss.length){ st.textContent=`빠진 회차 ${miss.length}개를 받는 중…`; const add=await fetchMissing(miss); merge(add); miss=missingRounds() }
  const rows=draws.map(d=>[d.no,d.date,...d.nums,d.bonus]);
  if(LOCAL){ try{ const j=await api("api/draws",{rows}); DRAWS_SRC=j.file||DRAWS_SRC }catch(e){} }
  else store(KEY+"draws_all",rows);
  DRAWS_OK = miss.length===0;
  const last=draws.at(-1);
  st.textContent = DRAWS_OK
    ? `과거 당첨번호 제1회 ~ 제${last.no}회(${last.date}) ${draws.length.toLocaleString()}건 전체 조회·분석 완료`
    : `제${miss[0]}회 등 ${miss.length}개 회차를 받지 못했습니다. 인터넷 연결을 확인한 뒤 [다시 조회]를 눌러 주세요.`;
  $("drawsNote").textContent = LOCAL&&DRAWS_SRC ? `당첨번호 기록: ${DRAWS_SRC}` : (LOCAL?"":"당첨번호 기록: 이 브라우저에 저장됨");
  $("retry").hidden = DRAWS_OK;
}

/* ===== 분석 ===== */
let A={};
const acValue=n=>{const s=new Set();for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)s.add(n[j]-n[i]);return s.size-5};
function analyze(){
  const freq=Array(46).fill(0), rec=Array(46).fill(0);
  draws.forEach(d=>d.nums.forEach(n=>freq[n]++));
  const last4=draws.slice(-4); last4.forEach(d=>d.nums.forEach(n=>rec[n]++));
  const sums=draws.map(d=>d.nums.reduce((a,b)=>a+b,0));
  const mean=sums.reduce((a,b)=>a+b,0)/sums.length;
  const sd=Math.sqrt(sums.reduce((a,b)=>a+(b-mean)**2,0)/sums.length);
  const nums=[...Array(45)].map((_,i)=>i+1);
  const byFreq=[...nums].sort((a,b)=>freq[b]-freq[a]||a-b);
  const hot=byFreq.slice(0,15), cold=[...nums].sort((a,b)=>freq[a]-freq[b]||a-b).slice(0,10);
  const byRec=[...nums].filter(n=>rec[n]>0).sort((a,b)=>rec[b]-rec[a]||freq[b]-freq[a]);
  // 최근 4주 최다 출현 등급부터, 최소 3개가 될 때까지 다음 등급 포함
  let recent=[]; for(const lv of [...new Set(byRec.map(n=>rec[n]))]){recent.push(...byRec.filter(n=>rec[n]===lv)); if(recent.length>=3) break;}
  const lo=Math.round(mean-sd), hi=Math.round(mean+sd);
  const R=[
    {k:"합계",d:`${lo} ~ ${hi} (평균 ${mean.toFixed(1)} ± 표준편차 ${sd.toFixed(1)})`,f:n=>{const s=n.reduce((a,b)=>a+b,0);return s>=lo&&s<=hi},core:1},
    {k:"홀짝 비율",d:"홀수 2 ~ 4개",f:n=>{const o=n.filter(x=>x%2).length;return o>=2&&o<=4},core:1},
    {k:"저고 비율",d:"1~22번 2 ~ 4개",f:n=>{const l=n.filter(x=>x<=22).length;return l>=2&&l<=4},core:1},
    {k:"연속번호",d:"연속 쌍 1개 이하",f:n=>n.slice(1).filter((x,i)=>x-n[i]===1).length<=1,core:1},
    {k:"번호대 분산",d:"10단위 구간 3개 이상",f:n=>new Set(n.map(x=>Math.floor((x-1)/10))).size>=3,core:1},
    {k:"용지 가로줄",d:"7×7 용지에서 4줄 이상에 분포",f:n=>new Set(n.map(x=>Math.floor((x-1)/7))).size>=4},
    {k:"용지 세로줄",d:"7×7 용지에서 4열 이상에 분포",f:n=>new Set(n.map(x=>(x-1)%7)).size>=4},
    {k:"AC값",d:"7 이상 (번호 간격의 다양성)",f:n=>acValue(n)>=7},
    {k:"끝수",d:"같은 끝자리 2개 이하",f:n=>{const c=Array(10).fill(0);n.forEach(x=>c[x%10]++);return Math.max(...c)<=2}},
  ];
  R.forEach(r=>r.rate=draws.filter(d=>r.f(d.nums)).length/draws.length*100);
  const past=new Set(draws.map(d=>d.nums.join(",")));
  A={freq,rec,mean,sd,hot,cold,recent,last4,R,past,lo,hi};
}

/* ===== 생성 ===== */
function wpick(pool,weightFn,ex){
  const c=pool.filter(n=>!ex.has(n)); if(!c.length) return null;
  const w=c.map(weightFn), t=w.reduce((a,b)=>a+b,0); let r=Math.random()*t;
  for(let i=0;i<c.length;i++){r-=w[i]; if(r<=0) return c[i]} return c.at(-1);
}
const PLAN={0:{hot:3,cold:1,rec:2},1:{hot:2,cold:1,rec:2},2:{hot:2,cold:1,rec:1},3:{hot:1,cold:1,rec:1}};
function makeGame(manual,taken){
  const plan=PLAN[manual.length];
  const hotW=n=>15-A.hot.indexOf(n)+5, coldW=()=>1, recW=n=>A.rec[n]**2+0.5;
  let best=null,bestScore=-1;
  for(let t=0;t<4000;t++){
    const ex=new Set(manual), tag={}; manual.forEach(n=>tag[n]="수동");
    let ok=true;
    const step=(k,pool,w,label)=>{for(let i=0;i<k;i++){const n=wpick(pool,w,ex); if(n==null){ok=false;return} ex.add(n); tag[n]=label}};
    step(plan.rec,A.recent,recW,"최근");
    step(plan.hot,A.hot,hotW,"자주");
    step(plan.cold,A.cold,coldW,"드묾");
    if(!ok||ex.size!==6) continue;
    const nums=[...ex].sort((a,b)=>a-b), key=nums.join(",");
    if(A.past.has(key)||taken.has(key)) continue;     // 역대 1등 조합·지금까지 생성한 조합 제외
    const pass=A.R.map(r=>r.f(nums)), score=pass.filter(Boolean).length+(pass.every((p,i)=>p||!A.R[i].core)?3:0);
    if(score>bestScore){best={nums,tag,pass};bestScore=score}
    if(pass.every(Boolean)) break;
  }
  return best;
}



/* ===== 사용량·생성 기록 =====
   설치형(PC): 실행기가 문서\로또번호생성기 폴더의 기록 파일로 하루 한도와 중복을 관리합니다.
   웹(홈페이지): 같은 정보를 이 브라우저에 저장합니다. */
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
let LOCAL=false, FOLDER="", S={date:today(),runs:0,games:[],last:[],history:[]};
async function api(path,body){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),4000);
  try{const r=await fetch(path,{method:body?"POST":"GET",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store",signal:c.signal});
      const j=await r.json(); if(!j.ok) throw Object.assign(new Error(j.error||"error"),{data:j}); return j}
  finally{clearTimeout(t)}
}
function fromServer(j){
  const last=S.last; S={date:j.date,runs:j.runs,games:j.today.map(g=>({nums:g.nums,tag:g.tag||{}})),last,history:j.history};
  FOLDER=j.folder||"";
}
async function loadState(){
  if(/^(127\.0\.0\.1|localhost)$/.test(location.hostname)){
    try{fromServer(await api("api/state")); LOCAL=true; return}catch(e){}
  }
  const u=load(KEY+"usage"), h=load(KEY+"history");
  S=(u&&u.date===today())?{last:[],...u}:{date:today(),runs:0,games:[],last:[]};
  S.history=Array.isArray(h)?h:[];
}
async function saveRun(made,modeLabel){
  if(LOCAL){ const j=await api("api/save",{mode:modeLabel,games:made}); fromServer(j); return }
  S.runs++; S.games.push(...made); S.history.push(...made.map(g=>g.nums.join(",")));
  const recs=load(KEY+"records")||[], tm=new Date().toTimeString().slice(0,8);
  made.forEach((g,i)=>recs.push({date:S.date,time:tm,run:S.runs,game:"ABCDE"[i]||String(i+1),mode:modeLabel,nums:g.nums,tag:g.tag}));
  store(KEY+"records",recs);
  store(KEY+"usage",{date:S.date,runs:S.runs,games:S.games,last:made}); store(KEY+"history",S.history);
}
function usage(){ if(S.date!==today()) S={date:today(),runs:0,games:[],last:[],history:S.history}; return S }
function renderHist(){
  $("histNote").textContent=`지금까지 생성한 조합 ${S.history.length.toLocaleString()}개는 다시 나오지 않습니다.`;
  $("folderRow").hidden=!LOCAL; if(LOCAL) $("folderPath").textContent=FOLDER;
}
function limitReached(u){return !TEST_MODE && (u.runs>=MAX_RUNS || u.games.length>=MAX_GAMES)}
const canGenerate=()=>DRAWS_OK && !!A.past;

/* ===== 화면 ===== */
const $=id=>document.getElementById(id);
const cls=n=>"c"+(n<=10?1:n<=20?2:n<=30?3:n<=40?4:5);
let mode="auto", picked=[];
function renderBoard(){
  const b=$("board"); b.innerHTML=""; b.classList.toggle("locked",mode==="auto");
  let row;
  for(let n=1;n<=45;n++){
    if(n%10===1){row=document.createElement("div");row.className="prow "+cls(n);row.setAttribute("role","group");row.setAttribute("aria-label",`${n}~${Math.min(n+9,45)}번`);b.appendChild(row)}
    const on=picked.includes(n), c=document.createElement("button");
    c.className="cell "+cls(n)+(on?" on":""); c.textContent=n; c.id="cell"+n; c.setAttribute("aria-pressed",on);
    c.disabled = mode==="auto" || (!on&&picked.length>=3);
    c.onclick=()=>{picked=on?picked.filter(x=>x!==n):[...picked,n].sort((a,b)=>a-b);renderBoard();renderHint()};
    row.appendChild(c);
  }
}
function renderHint(){
  if(mode==="auto"){$("hint").innerHTML="많이 나온 번호 <b>3</b> · 적게 나온 번호 <b>1</b> · 최근 4주 많이 나온 번호 <b>2</b>로 조합합니다.";return}
  const p=PLAN[picked.length];
  $("hint").innerHTML = picked.length
    ? `수동 <b>${picked.join(", ")}</b> 고정 · 나머지 ${6-picked.length}개는 많이 나온 ${p.hot} · 적게 나온 ${p.cold} · 최근 4주 ${p.rec}로 채웁니다.`
    : "번호판에서 <b>최대 3개</b>까지 고르세요. 나머지는 자동으로 채웁니다.";
}
function ballHTML(n,tag,i){return `<div class="ball${tag==="수동"?" manual":""}"><span class="${cls(n)}${i!=null?" pop":""}" style="${i!=null?`animation-delay:${i*45}ms`:""}">${n}</span>${tag?`<i>${tag}</i>`:""}</div>`}
function renderGames(animate){
  const u=usage(), g=$("games");
  if(!u.last.length){
    g.innerHTML='<div class="empty"><div class="ghostballs"><i></i><i></i><i></i><i></i><i></i><i></i></div>[번호 생성]을 누르면 5게임이 여기에 나옵니다.</div>';
    $("copy").hidden=true; $("resTitle").innerHTML="생성 번호";
  } else {
    $("resTitle").innerHTML=`생성 번호<small>${u.runs}회차</small>`;
    g.innerHTML=u.last.map((x,i)=>{
      const s=x.nums.reduce((a,b)=>a+b,0), o=x.nums.filter(n=>n%2).length, l=x.nums.filter(n=>n<=22).length;
      return `<div class="game"><div class="lbl">${String.fromCharCode(65+i)}</div>
      <div class="balls">${x.nums.map((n,k)=>ballHTML(n,x.tag[n],animate?i*6+k:null)).join("")}</div>
      <div class="meta">합 ${s} · 홀짝 ${o}:${6-o} · 저고 ${l}:${6-l} · AC ${acValue(x.nums)}</div></div>`}).join("");
    $("copy").hidden=false;
  }
  const blocked=limitReached(u);
  $("count").textContent=`오늘 ${u.runs} / ${MAX_RUNS}회 · ${u.games.length} / ${MAX_GAMES}게임`;
  $("meter").style.width=Math.min(100,u.games.length/MAX_GAMES*100)+"%";
  $("go").disabled=blocked||!canGenerate(); $("blocked").hidden=!blocked;
}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

function setMode(m){mode=m;$("mAuto").setAttribute("aria-pressed",m==="auto");$("mManual").setAttribute("aria-pressed",m==="manual");if(m==="auto")picked=[];renderBoard();renderHint()}
$("mAuto").onclick=()=>setMode("auto"); $("mManual").onclick=()=>setMode("manual");
let busy=false;
$("go").onclick=async()=>{
  if(busy) return; busy=true; $("go").disabled=true;
  try{
    if(LOCAL){ try{fromServer(await api("api/state"))}catch(e){} }
    const u=usage(); if(limitReached(u)){renderGames();return}
    const taken=new Set([...S.history,...u.games.map(g=>g.nums.join(","))]);
    const manual=mode==="manual"?picked.slice(0,3):[];
    if(!canGenerate()){ toast("과거 당첨번호 전체 조회가 끝나야 생성할 수 있습니다"); return }
    const made=[];
    for(let i=0;i<GAMES_PER_RUN;i++){const g=makeGame(manual,taken); if(g){taken.add(g.nums.join(","));made.push({nums:g.nums,tag:g.tag})}}
    // 최종 검사: 역대 1등 조합·이전 생성 조합은 절대 포함하지 않음
    const bad=made.filter(g=>A.past.has(g.nums.join(","))||S.history.includes(g.nums.join(",")));
    if(bad.length){ toast("검사에서 제외 조합이 발견되어 다시 생성해 주세요"); return }
    await deepAnalysis(manual);
    const label=manual.length?`일부 수동(${manual.join(",")})`:"전부 자동";
    try{ await saveRun(made,label); S.last=made }
    catch(e){
      if(e.data&&e.data.date) fromServer(e.data);
      if(e.data&&e.data.error==="limit") toast("오늘 생성 한도(20게임)를 모두 사용했습니다");
      else if(e.data&&e.data.error==="dup") toast("이미 생성한 조합이 나와 저장하지 않았습니다. 다시 눌러 주세요");
      else toast("기록 폴더에 저장하지 못했습니다. 바탕화면 아이콘으로 프로그램을 다시 실행해 주세요");
      renderHist(); renderGames(); return;
    }
    renderHist(); renderGames(true); refreshLogsIfOpen();
  } finally { busy=false; $("go").hidden=false; $("deep").hidden=true; $("go").disabled=limitReached(usage())||!canGenerate() }
};
$("copy").onclick=()=>{
  const txt=usage().last.map((g,i)=>`${String.fromCharCode(65+i)}: ${g.nums.join(" ")}`).join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("번호를 복사했습니다")).catch(()=>{const r=document.createRange();r.selectNodeContents($("games"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("선택된 번호를 Ctrl+C로 복사하세요")});
};
if(!TEST_MODE){$("verBadge").textContent="v3.0";$("testNote").hidden=true}
/* ===== 심층 분석 표시 (5초) ===== */
function deepAnalysis(manual){
  const box=$("deep"), secs=5, steps=[
    `역대 당첨번호 ${draws.length.toLocaleString()}회 출현 빈도 분석`,
    "최근 4주 당첨 흐름 확인",
    "합계·홀짝·저고·AC값 조화 검사",
    `역대 1등 ${A.past.size.toLocaleString()}개 조합 제외 확인`,
    `지금까지 생성한 ${S.history.length.toLocaleString()}개 조합 중복 확인`];
  if(manual.length) steps.splice(1,0,`수동 번호 ${manual.join(", ")} 고정`);
  box.hidden=false; $("go").hidden=true; $("games").setAttribute("aria-busy","true");
  return new Promise(res=>{
    const t0=performance.now();
    (function tick(){
      const el=(performance.now()-t0)/1000, left=Math.max(0,secs-el);
      $("deepSec").textContent=Math.ceil(left);
      $("deepBar").style.width=Math.min(100,el/secs*100)+"%";
      $("deepStep").textContent=steps[Math.min(steps.length-1,Math.floor(el/secs*steps.length))];
      if(el<secs) requestAnimationFrame(tick);
      else { box.hidden=true; $("go").hidden=false; $("games").removeAttribute("aria-busy"); res() }
    })();
  });
}

/* ===== 날짜별 생성 기록 조회 ===== */
let LOGS=[], logDate=null;
async function loadLogs(){
  if(LOCAL){ try{ LOGS=(await api("api/records")).records }catch(e){ toast("기록을 읽지 못했습니다"); LOGS=[] } }
  else LOGS=load(KEY+"records")||[];
}
function wd(d){return "일월화수목금토"[new Date(d+"T00:00:00").getDay()]}
function renderLogs(){
  const by={}; LOGS.forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
  const dates=Object.keys(by).sort().reverse();
  if(!dates.includes(today())) dates.unshift(today());
  if(!logDate||!dates.includes(logDate)) logDate=today();
  $("logDates").innerHTML=dates.map(d=>`<button class="dchip" data-d="${d}" aria-pressed="${d===logDate}">${d===today()?"오늘":d.slice(5).replace("-","/")+" ("+wd(d)+")"}<small>${(by[d]||[]).length}게임</small></button>`).join("");
  $("logDates").querySelectorAll(".dchip").forEach(b=>b.onclick=()=>{logDate=b.dataset.d;renderLogs()});
  const rows=(by[logDate]||[]).slice().sort((a,b)=>a.run-b.run||a.game.localeCompare(b.game));
  const runs=[...new Set(rows.map(r=>r.run))];
  $("logSum").innerHTML=`<span><b>${logDate}</b> (${wd(logDate)})</span><span>생성 <b>${runs.length}</b>회 · <b>${rows.length}</b>게임</span><span>전체 기록 <b>${LOGS.length.toLocaleString()}</b>게임</span>`;
  $("logCopy").hidden=!rows.length;
  if(!rows.length){$("logList").innerHTML=`<div class="logempty">${logDate===today()?"오늘":"이 날짜에"} 생성한 번호가 없습니다.</div>`;return}
  $("logList").innerHTML=runs.map(rn=>{
    const rs=rows.filter(r=>r.run===rn);
    return `<div class="runhead"><b>${rn}회차</b><span>${rs[0].time||""}</span><span class="pill">${rs[0].mode||""}</span></div>`+
      rs.map(r=>`<div class="lrow"><div class="lbl">${r.game}</div><div class="balls">${r.nums.map(n=>ballHTML(n,(r.tag||{})[n])).join("")}</div></div>`).join("");
  }).join("");
}
$("logOpen").onclick=async()=>{
  const card=$("logCard");
  if(!card.hidden){card.hidden=true;$("logOpen").setAttribute("aria-expanded","false");return}
  await loadLogs(); logDate=today(); renderLogs();
  card.hidden=false; $("logOpen").setAttribute("aria-expanded","true");
  card.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
};
$("logClose").onclick=()=>{$("logCard").hidden=true;$("logOpen").setAttribute("aria-expanded","false");$("logOpen").focus()};
$("logCopy").onclick=()=>{
  const rows=LOGS.filter(r=>r.date===logDate).sort((a,b)=>a.run-b.run||a.game.localeCompare(b.game));
  const txt=`로또 생성 기록 ${logDate}\n`+rows.map(r=>`${r.run}회차 ${r.game}: ${r.nums.join(" ")}`).join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("이 날짜 번호를 복사했습니다")).catch(()=>toast("복사하지 못했습니다. 번호를 직접 선택해 복사하세요"));
};
async function refreshLogsIfOpen(){ if(!$("logCard").hidden){ await loadLogs(); renderLogs() } }

$("openFolder").onclick=()=>api("api/open",{}).catch(()=>toast("폴더를 열지 못했습니다"));

(async()=>{
  renderBoard();renderHint();renderGames();$("go").disabled=true;
  await loadState(); renderHist(); renderGames();
  await updateOnce(); analyze(); renderGames();
  $("retry").onclick=async()=>{ $("retry").disabled=true; await updateOnce(); analyze(); renderGames(); $("retry").disabled=false };
  if(LOCAL) setInterval(()=>api("api/ping").catch(()=>{}),30000);   // 화면이 열려 있는 동안 실행기 유지
})();
</script>
