<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>게시판 관리 | csh2020</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,"Malgun Gothic",sans-serif;background:#07111f;color:#e2edf9;line-height:1.55;padding:24px 16px 60px}
.app{max-width:820px;margin:0 auto;display:grid;gap:16px}
h1{font-size:24px;font-weight:900}
h1 small{display:block;font-size:13px;font-weight:500;color:#9db7d0;margin-top:4px}
h1 small a{color:#67e8f9}
.card{background:#0f1f34;border:1px solid #1f3651;border-radius:18px;padding:18px;display:grid;gap:12px}
.card h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{font-size:13px;font-weight:700;color:#9db7d0;display:grid;gap:6px}
input[type=password]{width:100%;background:#07111f;border:1px solid #2a4566;border-radius:12px;color:#fff;font:inherit;font-size:15px;padding:11px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:12px;padding:11px 18px;cursor:pointer}
.p{background:#fde047;color:#111}.s{background:#1e3a5f;color:#e2edf9}.d{background:#7f1d1d;color:#fff}
button:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;font-weight:700;min-height:20px}
.ok{color:#a3e635}.err{color:#fca5a5}
.help{font-size:13px;color:#9db7d0;font-weight:500}
.help a{color:#67e8f9}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt button{padding:7px 14px;font-size:13px;background:#1e3a5f;color:#cbd5e1}
.filt button.on{background:#22d3ee;color:#04202b}
.list{display:grid;gap:10px}
.it{background:#07111f;border:1px solid #1f3651;border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.it.new{border-color:#fde047}
.it .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it .t{flex:1;min-width:0;font-size:16px;font-weight:800}
.badge{font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;flex:none}
.pub{background:#16a34a;color:#fff}.priv{background:#475569;color:#fff}.nw{background:#fde047;color:#111}
.it .m{font-size:12.5px;color:#9db7d0}
.it .b{font-size:15px;white-space:pre-line;overflow-wrap:anywhere;color:#e2edf9}
.it button{padding:6px 12px;font-size:13px;justify-self:start}
.em{color:#9db7d0;text-align:center;padding:20px}
</style></head><body>
<main class="app">
  <h1>게시판 관리<small>공개·비공개 게시글을 모두 보고 정리합니다 · <a href="/board" target="_blank">게시판 열기</a> · <a href="/admin">알림글 관리</a></small></h1>

  <section class="card" id="conn">
    <h2>관리자 연결</h2>
    <p class="help">알림글 관리(/admin)에서 연결한 브라우저는 자동으로 연결됩니다. 처음이면 GitHub 토큰을 넣어 주세요 (<a href="https://github.com/settings/tokens/new?scopes=public_repo&description=csh2020-admin" target="_blank" rel="noopener">토큰 만들기</a>, public_repo 권한). 새 글이 올라오면 hgy671001@gmail.com 으로 메일 알림이 갑니다.</p>
    <div id="tokBox"><label>GitHub 토큰<input type="password" id="tok" placeholder="ghp_..." autocomplete="off"></label></div>
    <div class="row"><button class="p" id="connBtn">연결</button><button class="s" id="discBtn">연결 해제</button><span class="msg" id="connMsg"></span></div>
  </section>

  <section class="card">
    <h2>게시글 <span class="help" id="sum"></span></h2>
    <div class="row" style="justify-content:space-between">
      <div class="filt" id="filt"><button data-f="all" class="on">전체</button><button data-f="new">새 글</button><button data-f="priv">비공개</button><button data-f="pub">공개</button></div>
      <button class="s" id="reload">새로고침</button>
    </div>
    <div class="list" id="list"><p class="em">관리자 연결 후 글이 보입니다.</p></div>
  </section>
</main>
<script>
var API='https://script.google.com/macros/s/AKfycbx9Jf-wKeOwKCc7jlYqv27MAZrY_vBFdHXj-dIHYZJFzIGr4rzWRcH45ZbXDEAbWKbq/exec';
var $=function(id){return document.getElementById(id);};
var items=[],filter='all',seen=0;
function tok(){try{return localStorage.getItem('csh_gh_tok')||'';}catch(e){return '';}}
function getSeen(){try{return Number(localStorage.getItem('csh_board_seen')||0);}catch(e){return 0;}}
function setSeen(v){try{localStorage.setItem('csh_board_seen',String(v));}catch(e){}}
function msg(el,t,ok){el.textContent=t;el.className='msg '+(ok?'ok':'err');}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function post(o){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json();});}
function render(){
  var nNew=items.filter(function(n){return n.ts>seen;}).length,nPriv=items.filter(function(n){return n.private;}).length;
  $('sum').textContent='전체 '+items.length+' · 새 글 '+nNew+' · 비공개 '+nPriv;
  var v=items.filter(function(n){return filter==='all'||(filter==='new'&&n.ts>seen)||(filter==='priv'&&n.private)||(filter==='pub'&&!n.private);});
  var L=$('list');
  if(!v.length){L.innerHTML='<p class="em">해당하는 글이 없습니다.</p>';return;}
  L.innerHTML=v.map(function(n){return '<div class="it'+(n.ts>seen?' new':'')+'"><div class="top">'+(n.ts>seen?'<span class="badge nw">NEW</span>':'')+'<span class="badge '+(n.private?'priv':'pub')+'">'+(n.private?'비공개':'공개')+'</span><span class="t">'+esc(n.title)+'</span></div>'+
    '<div class="m">'+esc(n.author)+' · '+esc(n.date)+'</div><div class="b">'+esc(n.body)+'</div><button class="d" data-id="'+esc(n.id)+'">삭제</button></div>';}).join('');
  L.querySelectorAll('button[data-id]').forEach(function(b){b.onclick=function(){
    if(!confirm('이 글을 삭제할까요? 게시판에서 사라집니다.'))return;b.disabled=true;
    post({a:'del',token:tok(),id:b.getAttribute('data-id')}).then(function(j){if(j.ok)load(false);else{b.disabled=false;alert(j.error||'삭제하지 못했습니다.');}});
  };});
}
// markSeen: 처음 열 때 NEW 표시는 보여 주고, 다음 방문부터는 읽은 글로 처리
function load(markSeen){
  if(!tok()){$('list').innerHTML='<p class="em">관리자 연결 후 글이 보입니다.</p>';return;}
  $('list').innerHTML='<p class="em">불러오는 중...</p>';
  post({a:'admin',token:tok()}).then(function(j){
    if(!j.ok){msg($('connMsg'),j.error||'관리자 확인에 실패했습니다.');$('list').innerHTML='<p class="em">관리자 확인에 실패했습니다. 토큰을 다시 연결해 주세요.</p>';return;}
    items=j.items||[];render();
    if(markSeen!==false&&items.length)setSeen(Math.max.apply(null,items.map(function(n){return n.ts;})));
  }).catch(function(){$('list').innerHTML='<p class="em">연결하지 못했습니다. 인터넷을 확인해 주세요.</p>';});
}
$('filt').querySelectorAll('button').forEach(function(b){b.onclick=function(){filter=b.getAttribute('data-f');$('filt').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});render();};});
$('reload').onclick=function(){load(false);};
$('connBtn').onclick=function(){
  var t=$('tok').value.trim();if(!t){msg($('connMsg'),'토큰을 입력해 주세요.');return;}
  fetch('https://api.github.com/repos/chisungho/chisungho.github.io',{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}}).then(function(r){return r.json().then(function(j){return [r.ok,j];});})
  .then(function(x){if(x[0]&&x[1].permissions&&x[1].permissions.push){try{localStorage.setItem('csh_gh_tok',t);}catch(e){}$('tok').value='';msg($('connMsg'),'연결되었습니다.',true);$('tokBox').style.display='none';load();}else msg($('connMsg'),'이 토큰으로는 관리자 권한이 없습니다.');})
  .catch(function(){msg($('connMsg'),'연결하지 못했습니다.');});
};
$('discBtn').onclick=function(){try{localStorage.removeItem('csh_gh_tok');}catch(e){}$('tokBox').style.display='';items=[];$('list').innerHTML='<p class="em">관리자 연결 후 글이 보입니다.</p>';msg($('connMsg'),'연결을 해제했습니다.',true);};
seen=getSeen();
if(tok()){$('tokBox').style.display='none';msg($('connMsg'),'이 브라우저는 관리자 연결이 되어 있습니다.',true);}
load();
</script>
</body></html>
