<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AOC 지승호 고문 | 동영상 명함</title>
<meta name="description" content="주식회사 에이오씨(AOC) 지승호 고문의 동영상 명함">
<meta name="robots" content="noindex">
<meta property="og:type" content="profile">
<meta property="og:title" content="AOC 지승호 고문 — 동영상 명함">
<meta property="og:description" content="에이오씨 고문 지승호입니다. 이제는 동영상 명함으로 나의 기억을 고객님에게 심어주세요.">
<meta property="og:image" content="https://csh2020.com/card/og.jpg">
<meta property="og:url" content="https://csh2020.com/card/">
<meta name="theme-color" content="#0b3d91">
<script>
/* 카카오톡 안 브라우저는 파일 저장을 막는다 → 열리자마자 휴대폰 기본 브라우저로 넘긴다(한 번만) */
(function(){
  if (/KAKAOTALK/i.test(navigator.userAgent) && location.hash !== '#ext') {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.origin + location.pathname + '#ext');
  }
})();
</script>
<style>
:root{--blue:#0b3d91;--blue2:#1e6bff}
*{box-sizing:border-box}
body{margin:0;background:#0a1630;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.card{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.video{margin-top:14px;border-radius:16px;overflow:hidden;background:#000;display:flex;justify-content:center;
  box-shadow:0 10px 28px rgba(0,0,0,.45)}
.video video{display:block;height:min(54vh,calc((100vw - 32px)*16/9));aspect-ratio:9/16;object-fit:cover;background:#000}
.save{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:62px;margin-top:16px;
  border:0;border-radius:14px;font:inherit;font-size:19px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(90deg,var(--blue),var(--blue2));box-shadow:0 8px 20px rgba(30,107,255,.35)}
.save:active{transform:translateY(1px)}
.msg{min-height:22px;margin-top:10px;font-size:14px;line-height:1.5;color:#bcd3ff;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <img class="card" src="og.jpg" alt="주식회사 에이오씨 고문 지승호 명함 · 010-4009-2592 · sh.ji@aoc-corp.com">
  <div class="video">
    <video src="aoc-jiseungho.mp4" poster="poster-v.jpg" controls playsinline preload="metadata"></video>
  </div>
  <button class="save" id="save">📥 휴대폰에 저장</button>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
  var VIDEO = 'aoc-jiseungho.mp4', VCF = 'jiseungho.vcf';
  var msg = document.getElementById('msg');
  function download(url, name){
    var a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  }
  var btn = document.getElementById('save');
  var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  var step = 0, videoFile = null;
  // 아이폰: 사진첩 저장용 공유 창이 바로 뜨도록 동영상을 미리 받아 둔다
  if (ios && navigator.canShare && window.fetch) {
    fetch(VIDEO).then(function(r){ return r.ok ? r.blob() : null; }).then(function(b){
      if (!b) return;
      var f = new File([b], 'AOC_지승호_고문_명함.mp4', {type: 'video/mp4'});
      if (navigator.canShare({files: [f]})) videoFile = f;
    }).catch(function(){});
  }
  btn.addEventListener('click', function(){
    if (!ios) {
      // 안드로이드: 한 번 누르면 동영상과 연락처를 함께 받는다
      download(VIDEO, 'AOC_지승호_고문_명함.mp4');
      download(VCF, '지승호_AOC고문.vcf');
      msg.textContent = '저장했어요. 연락처 화면이 뜨면 ‘저장’을 눌러 주세요.';
      return;
    }
    // 아이폰: 파일을 한 번에 하나만 받을 수 있어 두 번 누른다
    if (step === 0) {
      download(VCF, '지승호_AOC고문.vcf');
      step = 1;
      btn.textContent = '🎬 동영상도 저장';
      msg.textContent = '연락처 화면에서 ‘새로운 연락처 생성’을 누른 뒤, 아래 버튼으로 동영상도 저장하세요.';
    } else if (videoFile) {
      navigator.share({files: [videoFile]}).then(function(){ msg.textContent = '저장 완료!'; }).catch(function(){});
      msg.textContent = '공유 창에서 ‘비디오 저장’을 누르면 사진첩에 저장돼요.';
    } else {
      download(VIDEO, 'AOC_지승호_고문_명함.mp4');
    }
  });
})();
</script>
</body>
</html>
